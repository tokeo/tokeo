<script>
/* the colour mode: os (default), light or dark, kept per browser under the
key tokeo-theme; set before the stylesheets so the page does not flash */
(function () {
var mode = 'os';
try { mode = localStorage.getItem('tokeo-theme') || 'os'; } catch (error) {}
if (['os', 'light', 'dark'].indexOf(mode) < 0) mode = 'os';
document.documentElement.setAttribute('data-theme', mode);
})();
function tokeoDark() {
var mode = document.documentElement.getAttribute('data-theme');
return mode === 'dark' || (mode === 'os' && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
document.addEventListener('DOMContentLoaded', function () {
var buttons = document.querySelectorAll('.tk-mode button');
function mark(mode) {
buttons.forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.mode === mode)); });
}
mark(document.documentElement.getAttribute('data-theme'));
buttons.forEach(function (button) {
button.addEventListener('click', function () {
var dark = tokeoDark();
document.documentElement.setAttribute('data-theme', button.dataset.mode);
try { localStorage.setItem('tokeo-theme', button.dataset.mode); } catch (error) {}
mark(button.dataset.mode);
// mermaid draws once with the theme of the mode, a change redraws the page
if (dark !== tokeoDark() && document.querySelector('.mermaid')) location.reload();
});
});
});
</script>
<link rel="stylesheet" href="{{ root }}assets/hljs/styles/base16/woodland.min.css">
<script defer src="{{ root }}assets/highlight.min.js"></script>
<script defer src="{{ root }}assets/mermaid.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
// Process mermaid blocks before highlighting
document.querySelectorAll('pre code.language-mermaid').forEach(el => {
// Remove the code block from highlight.js processing
el.classList.remove('language-mermaid');
el.classList.add('nohighlight');
// Create a div for mermaid
const mermaidDiv = document.createElement('div');
mermaidDiv.className = 'mermaid';
mermaidDiv.innerHTML = el.textContent;
// Replace the code block with the mermaid div
const pre = el.parentElement;
pre.parentElement.replaceChild(mermaidDiv, pre);
});
hljs.configure({
languages: [
'accesslog', 'bash', 'c', 'cmake', 'cpp', 'css', 'diff', 'django',
'go', 'graphql', 'handlebars', 'ini', 'javascript', 'json', 'less',
'lua', 'makefile', 'markdown', 'mermaid', 'nginx', 'pgsql', 'php',
'plaintext', 'powershell', 'protobuf', 'python', 'python-repl',
'ruby', 'rust', 'scss', 'shell', 'sql', 'typescript', 'wasm',
'xml', 'yaml'
]
});
hljs.highlightAll();
// Initialize mermaid
mermaid.initialize({
startOnLoad: true,
// dark: the base theme drawn with the colours of the dark mode
theme: tokeoDark() ? 'base' : 'forest',
themeVariables: tokeoDark() ? {
darkMode: true, background: '#1d1a26', fontFamily: 'Inter, sans-serif',
primaryColor: '#241f30', primaryBorderColor: '#84b4ea', primaryTextColor: '#e6e1ee',
secondaryColor: '#1f2433', tertiaryColor: '#1a1722', lineColor: '#a9c6ea', textColor: '#e6e1ee',
edgeLabelBackground: '#2f2838', clusterBkg: '#1a1722', clusterBorder: '#3a3446'
} : {},
securityLevel: 'loose'
});
})
</script>
<script>
/* attach a copy control to every code box; clipboard api with a fallback
for non-secure contexts (file://), so the docs work opened as files too */
document.addEventListener('DOMContentLoaded', function () {
function fallbackCopy(text) {
var area = document.createElement('textarea');
area.value = text;
area.style.position = 'fixed';
area.style.opacity = '0';
document.body.appendChild(area);
area.select();
try { document.execCommand('copy'); } catch (error) {}
document.body.removeChild(area);
}
document.querySelectorAll('pre > code').forEach(function (code) {
var pre = code.parentElement;
if (pre.querySelector('.pdoc-copy')) return;
var button = document.createElement('button');
button.className = 'pdoc-copy';
button.type = 'button';
button.title = 'copy this block';
button.textContent = 'copy';
button.addEventListener('click', function () {
var text = code.innerText.replace(/\s+$/, '');
var done = function () {
button.textContent = 'copied';
button.classList.add('done');
setTimeout(function () {
button.textContent = 'copy';
button.classList.remove('done');
}, 1200);
};
if (navigator.clipboard && window.isSecureContext) {
navigator.clipboard.writeText(text).then(done);
} else {
fallbackCopy(text);
done();
}
});
pre.classList.add('pdoc-copyable');
pre.appendChild(button);
});
});
</script>

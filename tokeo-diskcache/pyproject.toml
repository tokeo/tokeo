[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokeo-diskcache"
# the version of diskcache the code is taken from
version = "5.6.3"
description = "Tokeo DiskCache - the disk and file backed cache of DiskCache without pickle."
readme = "README.md"
authors = [
    {name = "Tom Freudenberg", email = "th.freudenberg@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE.md"]
urls = {"Homepage" = "https://github.com/tokeo/tokeo"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = {find = {namespaces = true, include = ["tokeo", "tokeo.*"]}}
include-package-data = true

[tool.setuptools.package-data]
"tokeo" = ["**/*.md"]

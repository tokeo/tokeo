### **The Tokeo Main Configuration**<br/>
### <p>
### The tokeo.ext.appenv module handles the configuration loading and overriding mechanism for
### Tokeo and derived applications. Each configuration file is based on YAML files with a
### hierarchical structure that supports environment-specific config and local overrides.
### </p>
###
### ### Configuration File Hierarchy:
###
### <p>
### The configuration is loaded in the following order, with each file overriding
### options from the previous ones:
### </p>
###
### 1. Base configuration: ```config/tokeo/base.yaml```, then ```config/tokeo/base.d/*.yaml```
### 1. Environment configuration: ```config/tokeo/[environment].yaml```, then
###    ```config/tokeo/[environment].d/*.yaml```
### 1. Local configuration: ```[environment].local.yaml``` and the ```*.local.yaml``` of
###    ```[environment].d```, never for base
###
### <p>
### Where ```[environment]``` can be one of:
### </p>
###
### - ```development``` - Used during development
### - ```testing``` - Used for testing environments
### - ```staging``` - Used for staging environments
### - ```production``` - Used in production deployments
###
### ### Overloading Configuration:
###
### <p>
### The overloading mechanism allows for partial config to be defined in environment-specific
### or local configuration files. Only the specified options will be overridden, while all other
### options will be inherited from the base configuration.
### </p>
###
### <p>
### Example:
### </p>
###
### - Base config.yaml defines ```smtp.host: localhost```
### - Production config.yaml defines ```smtp.host: production.host.domain```
### - When running in production mode, ```smtp.host``` will be ```production.host.domain```
### - All other smtp options from the base config.yaml remain unchanged
###
### ### Extend Local Configuration Files:
###
### <p>
### Local configuration files (ending with ```.local.yaml```) are used for environment-specific
### secrets and options that should not be checked into source control. These files should
### be left added to ```.gitignore```.
### </p>
---



### ### Core Application Configuration
###
### Main Tokeo application config including debugging, plugins, and template locations
tokeo:
  ### Toggle application level debug (does not toggle framework debugging)
  # debug: false
  ### Where external (third-party) plugins are loaded from
  # plugin_dir: /var/lib/tokeo/plugins/
  ### Where all plugin configurations are loaded from
  # plugin_config_dir: /etc/tokeo/plugins.d/
  ### Where external templates are loaded from
  # template_dir: /var/lib/tokeo/templates/
  ### Directory of the crash files of the services, one per process name,
  ### with the stacks of all threads of a hard crash (segfault, abort)
  # crash_dir: /var/log/tokeo/
  ### Signal that writes the stacks of all threads into the crash file, or to
  ### stderr without crash_dir, the process runs on
  # thread_dump_signal: SIGUSR1



### ### Jinja2 Template Configuration
###
### Options for Jinja2 templating engine behavior and template locations
jinja2:
  # preserve the trailing newline when rendering templates.
  keep_trailing_newline: true
  # If this is set to True the first newline after a block is removed
  # (block, not variable tag!)
  trim_blocks: true
  # extra where to find templates
  # template_dirs:
  #   - extra/templates



### ### PDoc Documentation Generator Configuration
###
### Options for the PDoc Python documentation generator and server
pdoc:
  ### modules to render (str | list), app and test as default
  modules: null
  ### render content into output directory
  output_dir: html
  ### serve the pdoc service
  host: '127.0.0.1'
  ### port for serving the pdoc service
  port: 9999
  ### relative project path of the favicon, copied into the root of the docs
  favicon_path: public/favicon.ico
  ### module or absolute path to the jinja2 templates
  templates:
    - tokeo.templates.pdoc.html



### ### Logging Configuration
###
### Options for application logging using the colorlog package
log.colorlog:
  ### Where the log file lives (no log file by default)
  file: null
  ### The level for which to log.  One of: info, warning, error, fatal, debug
  level: info
  ### Whether or not to log to console
  to_console: true
  ### Whether or not to rotate the log file when it reaches ```max_bytes```
  # rotate: false
  ### Max size in bytes that a log file can grow until it is rotated.
  # max_bytes: 512000
  ### The maximum number of log files to maintain when rotating
  # max_files: 4

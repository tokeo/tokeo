[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokeo"
dynamic = ["version"]  # Declare version as dynamic
description = "Tokeo - An event-driven CLI framework with superpower for Python backends."
readme = "README.md"
authors = [
    {name = "Tom Freudenberg", email = "th.freudenberg@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE.md"]
urls = {"Homepage" = "https://github.com/tokeo/tokeo"}
requires-python = ">=3.11"
dependencies = [
    "cement==3.0.16",
    "cement[jinja2]",
    "jinja2>=3.1.6",
    "cement[yaml]",
    "PyYAML",
    "cement[colorlog]",
    "colorlog",
    "pdoc>=15.0.0",
    "markdown>=3.8.1",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.0.0",
    "build>=1.0.0",
    "setuptools>=83.0.0",
    "wheel>=0.46.2",
    "twine>=6.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "coverage>=7.10.0",
    "pyink>=26.5.1",
    "flake8>=7.0.0",
    "pyte",
    # packages necessary to run all macros
    "lazy_loader",
    "prompt_toolkit",
    "rich",
    "diskcache",
    "dramatiq>=2.2.1",
    "dramatiq[rabbitmq]",
    "pika",
    "grpcio>=1.56.2",
    "grpcio-tools",
    "protobuf>=6.33.5",
    "apscheduler>=3.0,<4.0",
    "requests>=2.33.0",
    "nicegui>=3.12.1",
    "fastapi",
    "starlette>=1.3.1",
    "pydantic[email]>=2.4.0",
    "pocketbase>=0.15.0",
    "invoke>=2.2.1",
    "paramiko>=5.0.0",
    "cryptography>=50.0.0",
    "watchdog",
]

[project.scripts]
tokeo = "tokeo.main:main"

[tool.setuptools]
packages = {find = {namespaces = true, include = ["tokeo", "tokeo.*"], exclude = ["ez_setup", "tests*"]}}
include-package-data = true

[tool.setuptools.package-data]
"tokeo" = ["**/*.md"]
"tokeo.templates" = ["**/*", "**/.*"]

[tool.setuptools.dynamic]
version = {attr = "tokeo.core.version.get_version"}
